<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Memory Sizing: a shared way for agile teams to estimate work.">
  <title>Memory Sizing</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/qrcode.js" defer></script>
  <script src="rooms.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">// Agile estimation</p>
    <h1>Memory <span>Sizing</span></h1>
    <p class="intro">Choose your estimate privately. Reveal together, compare perspectives, and agree on an estimate as a team.</p>
    <div class="signal" aria-hidden="true">
      <span class="streams"></span>
      <span class="memory">
        <span class="memory-chips">
          <span>3</span>
          <span>5</span>
          <span>8</span>
        </span>
      </span>
    </div>
    <form id="room-form">
      <label for="display-name">Display name</label>
      <input id="display-name" name="name" required maxlength="32" autocomplete="nickname">
      <button id="connect" type="submit">Create room</button>
    </form>
    <section id="room" hidden aria-labelledby="room-heading">
      <div>
        <button id="copy" type="button">Copy join URL</button>
        <input id="join-url" aria-label="Join URL" readonly>
        <p id="join-qr" hidden>
          Scan to join on another device.<br>
          <img alt="QR code for the room join URL">
        </p>
        <h2 id="room-heading" tabindex="-1">Room participants</h2>
        <ul id="roster"></ul>
        <button id="start-voting" type="button" hidden>Start voting</button>
        <button id="skip-discussion" type="button" hidden>Skip discussion</button>
        <p id="round-timer" role="timer" hidden></p>
        <fieldset id="vote-deck" disabled>
          <legend>Choose a private estimate</legend>
        </fieldset>
        <button id="reveal" type="button" hidden>Reveal votes</button>
        <form id="save-estimate" hidden>
          <label for="item-name">Item</label>
          <input id="item-name" required maxlength="20">
          <label for="agreed-estimate">Agreed estimate</label>
          <input id="agreed-estimate" required maxlength="4">
          <button type="submit">Save estimate</button>
        </form>
        <button id="leave" type="button">Leave room</button>
      </div>
      <aside id="session-history" aria-labelledby="history-heading">
        <h2 id="history-heading">Session history</h2>
        <ol id="history-list"></ol>
        <p id="history-empty">No estimates saved yet.</p>
      </aside>
    </section>
    <p id="feedback" role="status"></p>
  </main>
</body>
</html>
